services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scandine
      POSTGRES_PASSWORD: scandine_dev_password
      POSTGRES_DB: scandine
    ports:
      - "5432:5432"
    volumes:
      - scandine_pgdata:/var/lib/postgresql/data
volumes:
  scandine_pgdata:
